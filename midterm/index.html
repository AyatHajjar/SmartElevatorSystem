<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>Project Website</h1>

        <nav>
            <button type="button" onclick="showSignup()">Signup</button>
            <button type="button" onclick="showLogin()">Login</button>
        </nav>
    </div>

    <form id="signupForm" action="auth.php" method="post">
        <fieldset>
            <legend>Signup</legend>

            <input type="hidden" name="action" value="signup">

            <label>Username:</label>
            <input type="text" id="signupUsername" name="username" required>

            <label>Password:</label>
            <input type="password" id="signupPassword" name="password" required>

            <button type="submit">Add me</button>
        </fieldset>
    </form>

    <form id="loginForm" action="auth.php" method="post" style="display:none;">
        <fieldset>
            <legend>Login</legend>

            <input type="hidden" name="action" value="login">

            <label>Username:</label>
            <input type="text" id="loginUsername" name="username" required>

            <label>Password:</label>
            <input type="password" id="loginPassword" name="password" required>

            <button type="submit">Add me</button>
        </fieldset>
    </form>

    <p id="error"></p>

</div>

<script src="main.js"></script>

</body>
</html>
